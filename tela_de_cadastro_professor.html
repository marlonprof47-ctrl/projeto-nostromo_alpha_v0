<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="style_cadastro_professor.css">
</head>
<body>
  <div class="container">
    <a href="#" class="back-arrow">←</a>
    <h1 class="title">Cadastro</h1>

    <form class="form">
      <input type="text" placeholder="Nome Completo" required>
      <input type="email" placeholder="E-mail Institucional" required>
      <input type="password" placeholder="Criar Senha" required>
      <input type="password" placeholder="Repetir Senha" required>
      <input type="text" name="Cadastro" placeholder="Cadastro" required>
      <button type="submit" class="btn">Cadastrar</button>


    <div class="login-link">
      <a href="#">Já tem uma conta? <span>Entrar</span></a>
    </div>
  </div>
</body>
</html>
